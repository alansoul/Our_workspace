name: 🐛 Bug Report
description: Report a reproducible problem
title: '[BUG]: '                          # Auto-fills the issue title
labels: ['bug', 'triage']                 # Auto-adds these labels
body:
  # Field 1: Info banner at the top
  - type: markdown
    attributes:
      value: 'Thanks for reporting. Please fill out the required sections.'

  # Field 2: Text input for which app has the bug
  - type: input
    id: app
    attributes:
      label: Which application / service?
      placeholder: 'e.g. apps/workspace, auth-api'
    validations:
      required: true                       # ⚠️ Cannot submit without this
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste terminal output or browser console logs here.
      render: shell                        # 👈 Formats as code block