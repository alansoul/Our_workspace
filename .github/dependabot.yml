version: 2
updates:
  # NPM packages (weekly)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Kolkata'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'type: dependencies'
    open-pull-requests-limit: 10
    groups:
      # Group all Nx updates together
      nx:
        patterns:
          - '@nx/*'
          - 'nx'
      # Group all NestJS updates together
      nestjs:
        patterns:
          - '@nestjs/*'
      # Group all React updates together
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'next'

  # GitHub Actions (monthly)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'type: dependencies'
      - 'domain: infra'