'domain: frontend':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/**'
          - 'apps/workspace/**'
          - 'libs/**/ui/**'

'domain: backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/*api*/**'
          - 'libs/**/data-access/**'
          - 'libs/**/prisma/**'

'domain: infra':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'nx.json'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - '.npmrc'