name: CI Pipeline

on:
  push:
    branches:
      - main                                 # Runs when code is pushed to main
  pull_request:                              # Runs when any PR is opened/updated

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workspace (Affected)
    runs-on: ubuntu-latest                   # Uses a Linux VM on GitHub
    permissions:
      contents: read                         # Can read your code
      actions: read                          # Can check other workflow runs

    steps:
      # STEP 1: Download your code onto the GitHub VM
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # Get FULL git history (needed for "affected")

      # STEP 2: Install Node + pnpm + dependencies (uses your reusable action!)
      - name: 🛠️ Setup Workspace
        uses: ./.github/actions/setup-workspace

      # STEP 3: Figure out which commits to compare against
      - name: 🔍 Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      # STEP 4: 🧹 Lint only the projects that were affected by the changes
      - name: 🧹 Lint Affected
        run: pnpm nx affected -t lint --parallel=3

      # STEP 5: 🧪 Run tests (but don't fail if there are no tests yet)
      - name: 🧪 Test Affected
        run: pnpm nx affected -t test --parallel=3 --passWithNoTests
        continue-on-error: true # 👈 Add this so unfinished placeholder tests don't fail the pipeline!

      # STEP 6: 🏗️ Build affected projects to make sure they compile
      - name: 🏗️ Build Affected
        run: pnpm nx affected -t build --parallel=3