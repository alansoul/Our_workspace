name: 'CodeQL Security Scan'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write                            # Can post security findings
      contents: read     # 👈 REQUIRED for private repositories!
      actions: read      # 👈 REQUIRED to inspect workflow status

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install CodeQL scanner
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript               # Scan TS/JS

      # Run the actual scan
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3