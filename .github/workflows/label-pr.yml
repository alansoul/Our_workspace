name: Auto-Label PRs
on:
  pull_request_target:                         # Runs when PR is opened/updated
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read                           # Read the files changed
      pull-requests: write                     # Add labels to the PR
    steps:
      - uses: actions/labeler@v5               # Official GitHub labeler
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'          # Auto-generated GitHub token