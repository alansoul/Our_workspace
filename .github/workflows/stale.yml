name: Close Stale Issues & PRs

on:
  schedule:
    - cron: '0 2 * * *' 

permissions:
  issues: write                          # Can mark issues as stale
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30                     # After 30 days of no activity → mark as "stale"
          days-before-close: 7                      # After 7 more days → auto-close
          stale-issue-message: 'This issue has been inactive for 30 days and will be closed in 7 days.'
          stale-issue-label: 'stale'